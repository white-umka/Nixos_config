# ~/.config/hypr/hyprland.conf

# Monitor - if name is wrong, run: hyprctl monitors
# To auto-pick highest refresh rate, use: monitor=,highrr,auto,1
monitor=HDMI-A-1,1920x1080@100,0x0,1

# NVIDIA environment
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NIXOS_OZONE_WL,1

# Autostart
# exec-once = waybar пока не надо
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet

# Main modifier
$mainMod = SUPER

# Keybinds
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exit,
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy 
bind = $mainMod, W, exec, waytrogen

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Keyboard layout (RU + US, switch with Alt+Shift)
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
}

# Установка темы курсора (работает для большинства приложений)
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

# Для старых приложений (XCursor)
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# Look and feel
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(a78bfaff)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 15
    blur {
        enabled = true
        size = 3
        passes = 1
    }
   #active_opacity = 0.9

    # Прозрачность неактивных окон
    #inactive_opacity = 0.9

    # Прозрачность полноэкранных окон (обычно оставляют 1.0)
    #fullscreen_opacity = 0.9

}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
